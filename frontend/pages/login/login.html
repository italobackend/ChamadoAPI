<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="Login.css">
    <title>ChamadoAPI - Login</title>
</head>
<body>
<div id="login-container">
    <h1>Acesse sua conta</h1>

    <form id="login-form">
        <label for="login">Usuário</label>
        <input type="text" id="login" name="login" placeholder="Digite seu usuário">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

        <button id="btn-acessar" type="submit">Acessar</button>
        <p id="error-message"></p>
    </form>

</div>
<script>
    const formulario = document.querySelector('#login-form');

    formulario.addEventListener('submit', function (evento) {
        evento.preventDefault();


        const usuario = document.querySelector('#login').value;
        const senha = document.querySelector('#senha').value;
        const mensagemErro = document.querySelector('#error-message');

        if (usuario === '' || senha === '') {
            mensagemErro.textContent = "Preencha usuário e senha!";
            return;
        }

        mensagemErro.textContent = "";
        window.location.href = "../chamado/chamados.html";
    });
</script>
</body>
</html>
