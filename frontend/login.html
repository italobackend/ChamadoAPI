<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="pages/css/login.css">

    <title>ChamadoAPI - Login</title>
</head>
<body>
<div id="login-container">
    <h1>Acesse sua conta</h1>

    <form id="login-form">
        <label for="login">Usuário</label>
        <input type="text" id="login" name="login" placeholder="Digite seu usuário">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

        <button id="btn-acessar" type="submit">Acessar</button>
        <p id="mensagem-erro"></p>
    </form>
</div>
<script src="pages/login/login.js"></script>
</body>
</html>
